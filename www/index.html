<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12382f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Internkontroll</title>
    <link rel="icon" href="assets/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/logo-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="no-top no-tab">
    <header class="topbar" id="topbar" hidden>
      <button type="button" class="icon-btn" id="back-btn" aria-label="Tilbake" hidden></button>
      <img class="topbar-logo" src="assets/logo-256.png" alt="" />
      <div class="topbar-text">
        <p id="top-kicker" class="kicker" hidden></p>
        <h1 id="top-title">Internkontroll</h1>
      </div>
      <button type="button" class="icon-btn" id="top-action" hidden></button>
    </header>
    <div id="net-banner" class="net-banner" hidden>
      <span id="net-banner-text"></span>
      <button type="button" id="net-retry" class="btn btn-ghost" hidden>Prøv igjen nå</button>
    </div>
    <main id="main">
      <p class="boot">Starter…</p>
    </main>
    <nav id="tabbar" class="tabbar" hidden>
      <button type="button" class="tab" data-tab="projects">Prosjekter</button>
      <button type="button" class="tab tab-cam" data-tab="capture" aria-label="Ta bilde"></button>
      <button type="button" class="tab" data-tab="reminders">Påminnelser</button>
    </nav>
    <script src="vendor/firebase-app-compat.js"></script>
    <script src="vendor/firebase-auth-compat.js"></script>
    <script src="vendor/firebase-firestore-compat.js"></script>
    <script src="vendor/firebase-storage-compat.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
